[workspace]
members = [
    "desktop/fm-core",
    "desktop/fm-cli",
    "desktop/fm-gui",
    "mobile/runner",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.82"
license = "MPL-2.0"
repository = "https://github.com/figura/munda"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
quick-xml = "0.37"
flate2 = "1"
lopdf = { version = "0.36", default-features = false, features = ["time"] }
walkdir = "2"
rayon = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
xattr = "1"

[profile.release]
# Reproducible-build posture: no incremental, deterministic codegen units.
codegen-units = 1
panic = "abort"
strip = true
